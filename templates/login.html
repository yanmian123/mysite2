<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <title>博客系统用户登录界面 - Powered by python222</title>
    <!-- 引入 Bootstrap CSS -->
    <link href="{% static "bootstrap/css/bootstrap.css" %}" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 400px;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h2 class="text-center mb-4">用户登录</h2>
        <form action="{% url 'login' %}" method="post" onsubmit="return checkForm()">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">用户名</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="请输入用户名"
                    value="{{ username }}">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">密码</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码"
                    value="{{ password }}">
            </div>
<div class="mb-3">
    <label for="code" class="form-label">验证码</label>
    <div class="input-group">
        <input type="text" class="form-control" id="code" name="code" placeholder="请输入验证码">
        <input type="hidden" id="uuid" name="uuid">
        <img id="imgcode" src="" alt="验证码" style="cursor:pointer;margin-left:10px;height:38px;" title="看不清？点击换一张">
    </div>
</div>                
            <div>
                    <input type="checkbox" id="remember_me" name="remember_me" {% if remember_me %}checked{% endif %}>
                    <label for="remember_me" class="label-text">记住密码<label>
                </div>
            <div class="d-flex justify-content-between align-items-center">

                <a href="{% url 'toregisterpage' %}" class="text-decoration-none">用户注册</a>
                <button type="submit" class="btn btn-primary">登录</button>
            </div>
            <span class="text-danger mt-2 d-block" id="error">{{ errorInfo }}</span>
        </form>
    </div>
    <!-- 引入 Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript">

            // 生成uuid
    function generateUUID() {
        let d = new Date().getTime();
        if (window.performance && typeof window.performance.now === "function") {
            d += performance.now();
        }
        return 'xxxxxxxxxxxx4xxxyxxxxxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
            let r = (d + Math.random() * 16) % 16 | 0;
            d = Math.floor(d / 16);
            return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
        });
    }

    // 加载和刷新验证码图片
    function refreshImgCode() {
        let uuid = generateUUID();
        document.getElementById('uuid').value = uuid;
        document.getElementById('imgcode').src = '/verifications/imgcodes/' + uuid + '/?t=' + new Date().getTime();
    }

    // 页面加载时自动加载验证码，并绑定点击事件
    window.onload = function () {
        refreshImgCode();
        document.getElementById('imgcode').onclick = refreshImgCode;
    };


        function checkForm() {
            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;
            if (username === "") {
                document.getElementById('error').innerHTML = "用户名不能为空！";
                return false;
            }
            if (password === "") {
                document.getElementById('error').innerHTML = "密码不能为空！";
                return false;
            }
            
            


            return true;
        }
    </script>
</body>

</html>
