{% extends "base.html" %}

{% block content %}
<div class="feed-container">
    <h3>关注动态</h3>
    {% for article in pagedata %}
        <div class="feed-item">
            <div class="author-info">
                
                <span class="author-name">{{ article.author.name }}</span>
            </div>
            <div class="article-content">
                <h4><a href="{% url 'articledetail' article.author.id article.id %}">
                    {{ article.title }}
                </a></h4>
                <p>{{ article.abstract }}</p>
                <div class="article-meta">
                    <span>{{ article.create_time|date:"Y-m-d H:i" }}</span>
                    <span>阅读 {{ article.reads }}</span>
                </div>
            </div>
        </div>
    {% endfor %}
    
    <!-- 分页控件 -->
</div>

<style>
.feed-item {
    border-bottom: 1px solid #eee;
    padding: 20px 0;
}
.author-info {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
}
.author-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    margin-right: 10px;
}
</style>
{% endblock %}
