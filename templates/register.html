<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <title>博客系统用户注册 - Powered by python222</title>
    <!-- 引入 Bootstrap CSS -->
    <link href="{% static "bootstrap/css/bootstrap.css" %}" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .register-container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 400px;
        }
    </style>
</head>

<body>
    <div class="register-container">
        <h2 class="text-center mb-4">用户注册</h2>
        <form action="register" method="post" onsubmit="return checkForm()">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">用户名</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="请输入用户名"
                    value="{{ username }}">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">密码</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码"
                    value="{{ password }}">
            </div>
            <div class="mb-3">
                <label for="password2" class="form-label">确认密码</label>
                <input type="password" class="form-control" id="password2" name="password2" placeholder="请输入确认密码"
                    value="{{ password2 }}">
            </div>
            <div class="d-flex justify-content-between align-items-center">
                <a href="{% url 'login'%}" class="text-decoration-none">用户登录</a>
                <button type="submit" class="btn btn-primary">注册</button>
            </div>
            <span class="text-danger mt-2 d-block" id="error">{{ info }}</span>
        </form>
    </div>
    <!-- 引入 Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript">
        function checkForm() {
            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;
            var password2 = document.getElementById('password2').value;
            if (username === "") {
                document.getElementById('error').innerHTML = "用户名不能为空！";
                return false;
            }
            if (password === "") {
                document.getElementById('error').innerHTML = "密码不能为空！";
                return false;
            }
            if (password2 === "") {
                document.getElementById('error').innerHTML = "确认密码不能为空！";
                return false;
            }
            if (password !== password2) {
                document.getElementById('error').innerHTML = "确认密码输入不正确！";
                return false;
            }
            return true;
        }
    </script>
</body>

</html>
