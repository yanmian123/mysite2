services:
  web:
    build: .
    command: bash -c "python wait_for_db.py && daphne -b 0.0.0.0 -p 8000 mysite2.asgi:application"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DB_HOST=db
    depends_on:
      - db
      - redis
  db:
    image: mysql:8.0 # 或您使用的版本
    environment:
      MYSQL_DATABASE: mysiteblog
      MYSQL_ROOT_PASSWORD: 123456
      # MYSQL_USER: root
      # MYSQL_PASSWORD: 123456
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    # 添加以下行解决 MySQL 8.0 认证问题
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 10s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  mysql_data:
  redis_data:
